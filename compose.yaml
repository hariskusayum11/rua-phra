services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rua
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: rua_phra
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rua_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rua -d rua_phra"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rua_data:
